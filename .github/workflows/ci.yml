name: ci

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog, Verilator, and cocotb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog verilator make python3 python3-venv python3-pip
          python3 -m venv .venv
          .venv/bin/pip install -r tb/cocotb/requirements.txt
          iverilog -V 2>&1 | head -n 1
          verilator --version
          .venv/bin/python -c 'import cocotb; print("cocotb", cocotb.__version__)'
      - name: Lint (verilator --lint-only -Wall)
        run: make lint
      - name: Self-checking testbenches (Icarus + cocotb)
        run: make test PYTHON=.venv/bin/python
      - name: Coverage (Verilator)
        run: make coverage JOBS=2
      - name: Coverage summary
        if: always()
        run: |
          if [ -f build/coverage/summary.txt ]; then
            { echo '### Coverage (rtl/)'; echo '```'; cat build/coverage/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-and-coverage
          path: |
            build/sim/*.log
            build/coverage/summary.txt
            build/coverage/annotated
          if-no-files-found: ignore

  synth:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: YosysHQ/setup-oss-cad-suite@v3
      - name: Fetch sky130_fd_sc_hd liberty (typical corner)
        run: make fetch-lib
      - name: Yosys synthesis to sky130_fd_sc_hd
        run: make synth NICE=
      - name: Synthesis summary
        run: |
          { echo '### Synthesis (sky130_fd_sc_hd)'; echo '```'; cat build/synth/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: synth
          path: build/synth

  formal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: YosysHQ/setup-oss-cad-suite@v3
      - name: SymbiYosys (CRC BMC, UART FSM, register file)
        run: make formal NICE=

  gls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: YosysHQ/setup-oss-cad-suite@v3
      - name: Generic-cell synthesis and Icarus gate-level sim
        run: make gls NICE=
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gls
          path: |
            build/gls/tb_top.log
            build/gls/yosys.log
          if-no-files-found: ignore
